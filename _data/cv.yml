    Experience:
      - company: Clarkson University
        position: PhD Candidate & Research Assistant
        location: Potsdam, NY
        start_date: 2023
        end_date: present
        highlights:
          - Designed a variational learning framework to infer interaction kernels and environmental forces in physics-inspired collective dynamics models using trajectory data from high-dimensional agent-based systems.
          - Implemented parametric and nonparametric estimators for interaction laws and evaluated performance under varying data regimes and noise levels.
          - Developed reproducible simulation and evaluation pipelines incorporating training randomness analysis, KDE-based weighting, and statistically grounded error metrics.
          - Applied methods to models in biology, physics, and engineering including phototaxis in bacteria and opinion dynamics.

      - company: Vironix Health — MPI–SIAM Workshop
        position: Industry Research Collaborator
        location: Claremont, CA
        start_date: 2025
        end_date: 2025
        highlights:
          - Developed a domain-expertise-aware aggregation framework reweighting GAN discriminator outputs using distances in VAE-learned latent spaces.
          - Designed a decision model to reassess clinician judgments on synthetic chronic kidney disease (CKD) patient reports.

      - company: SIAM Graduate Student Mathematical Modeling Camp (GSMMC)
        position: Research Collaborator
        location: Pomona, CA
        start_date: 2025
        end_date: 2025
        highlights:
          - Investigated randomized least-squares regression using Johnson–Lindenstrauss sketching methods (SJLT, SRHT) to reduce dimensionality while preserving predictive accuracy.
          - Applied techniques to high-dimensional classification tasks including cancer detection and handwritten digit recognition.

      - company: University of Kelaniya
        position: Instructor, Department of Mathematics
        location: Kelaniya, Sri Lanka
        start_date: 2018
        end_date: 2019
        highlights:
          - Taught Scientific Computing I & II (MATLAB), Elementary ODEs, and Discrete Mathematics for Computing.

